name: Deploy Static Site to Azure Storage

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload static files to $web
        run: |
          az storage blob upload-batch \
            --account-name lab6bhomjan \
            --destination '$web' \
            --source . \
            --auth-mode login \
            --overwrite true
